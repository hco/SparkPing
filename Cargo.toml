[package]
name = "SparkPing"
version = "0.2.3"
edition = "2021"

[dependencies]
config = "0.15"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# Pinned: the on-disk format has changed between minor versions before.
# Patched below (see ADR 0003).
tsink = "=0.10.2"
ping = "0.7"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "chrono"] }
axum = "0.7"
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
toml_edit = "0.22"
notify = "7.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
libc = "0.2"
mdns-sd = "0.11"
flume = "0.11"
axum-extra = { version = "0.9", features = ["typed-header"] }
async-stream = "0.3"
hostname = "0.4"
if-addrs = "0.10"
dialoguer = "0.11"
console = "0.15"
reqwest = "0.13.1"
quick-xml = { version = "0.38.4", features = ["serde", "serialize"] }
socket2 = "0.6.3"
file-rotate = "0.8.0"
# Only reads tsink 0.5 data during the migration to 0.10 (see ADR 0003).
tsink_legacy = { version = "=0.5.0", package = "tsink" }

[target.'cfg(not(any(target_env = "msvc", target_env = "musl")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
tempfile = "3.27.0"

# tsink 0.10.2 with two fixes, drop once fixed upstream: a WAL reset race that
# trips background fail-fast and makes the storage reject all operations, and
# compaction loading a whole level into memory (OOM during large imports).
[patch.crates-io]
tsink = { git = "https://github.com/hco/tsink", rev = "d358b7516d701f38a229175657ad112ae1d90a42" }
